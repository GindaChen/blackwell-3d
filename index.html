<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vera Rubin 3D</title>
    <meta name="description" content="Interactive 3D model of NVIDIA's Vera Rubin superchip, NVL72 compute tray and HGX NVL8 GPU tray, with connection tracing and guided tours." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://verarubin.pages.dev/" />
    <meta property="og:title" content="Vera Rubin 3D" />
    <meta property="og:description" content="Interactive 3D model of NVIDIA's Vera Rubin superchip, NVL72 compute tray and HGX NVL8 GPU tray, with connection tracing and guided tours." />
    <meta property="og:image" content="https://verarubin.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exploded 3D render of a Vera Rubin NVL72 compute tray: cold plates, superchips and GPUs lifted above the chassis." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://verarubin.pages.dev/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <header class="hud hud-title">
      <h1 id="view-title">Vera Rubin Superchip</h1>
      <div class="mode-toggle" role="group" aria-label="Mode">
        <button type="button" data-mode="free" class="active" aria-pressed="true">Free mode</button>
        <button type="button" data-mode="guided" aria-pressed="false">Guided mode</button>
      </div>
    </header>

    <nav class="hud hud-views" aria-label="Views">
      <button data-view="superchip" class="active">Superchip</button>
      <button data-view="tray">Compute tray</button>
      <button data-view="nvl8">8-GPU tray</button>
    </nav>

    <details class="hud hud-controls" id="controls" open>
      <summary>Display options</summary>
      <div class="controls-body">
        <label class="row explode-row"><span>Exploded view</span><input id="explode" type="range" min="0" max="1" step="0.001" value="0" /></label>
        <label class="row toggle"><input id="lids" type="checkbox" /><span>Heat-spreader lids</span></label>
        <label class="row toggle"><input id="floorplan" type="checkbox" /><span>CPU die floorplan</span></label>
        <label class="row toggle tray-only"><input id="cooling" type="checkbox" checked /><span>Cold plates</span></label>
      </div>
    </details>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Fabricating silicon…</div>
    </div>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
